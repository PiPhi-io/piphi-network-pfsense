name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pdm
      - run: pdm install -G dev
      - run: pdm run pytest
      - run: pdm run ruff check src tests
      - run: pdm run mypy --strict src
      - run: pdm run python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
        working-directory: widgets/pfsense-overview
      - run: npm test
        working-directory: widgets/pfsense-overview
      - run: npm run validate
        working-directory: widgets/pfsense-overview
      - run: npm run conformance
        working-directory: widgets/pfsense-overview
      - run: npm ci --ignore-scripts
        working-directory: widgets/pfsense-client-security
      - run: npm test
        working-directory: widgets/pfsense-client-security
      - run: npm run validate
        working-directory: widgets/pfsense-client-security
      - run: npm run conformance
        working-directory: widgets/pfsense-client-security
      - run: docker build -t piphi-runtime-smoke .
