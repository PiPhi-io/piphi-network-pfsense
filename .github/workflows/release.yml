name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing semantic-version release tag (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/piphinetwork/piphi-network-pfsense
  RELEASE_REF: ${{ inputs.release_ref }}

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install PDM
        run: python -m pip install --disable-pip-version-check pdm

      - name: Install locked development dependencies
        run: pdm install -G dev --frozen-lockfile

      - name: Validate release versions
        run: pdm run python scripts/check_release.py "${RELEASE_REF}"

      - name: Run backend verification
        run: |
          pdm run pytest
          pdm run ruff check src tests
          pdm run ruff format --check src tests
          pdm run mypy --strict src
          pdm run python scripts/validate.py

      - name: Verify widgets
        run: |
          for widget in pfsense-overview pfsense-client-security; do
            npm ci --ignore-scripts --prefix "widgets/${widget}"
            npm test --prefix "widgets/${widget}"
            npm run validate --prefix "widgets/${widget}"
            npm run conformance --prefix "widgets/${widget}"
          done

      - name: Build Python distributions
        run: pdm build

      - name: Assemble release assets
        run: |
          VERSION="${RELEASE_REF#v}"
          mkdir -p release
          cp dist/* release/
          tar \
            --exclude='*/node_modules' \
            --exclude='*/.gitignore' \
            -czf "release/piphi-network-pfsense-${VERSION}.tar.gz" \
            manifest.json schema src widgets Dockerfile pyproject.toml pdm.lock README.md docs examples
          cd release
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish-container:
    name: Publish multi-platform container
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub with OIDC
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: piphinetwork

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_REF }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_REF, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest container image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub Release
    needs: [verify-and-package, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_REF}" release/* \
            --verify-tag \
            --generate-notes \
            --title "PiPhi Network pfSense ${RELEASE_REF}"
